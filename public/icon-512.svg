<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Fundo sólido sem bordas arredondadas (a Apple aplica a própria máscara) -->
  <rect width="512" height="512" fill="url(#bg)" />
  <text x="50%" y="54%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="280" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)" letter-spacing="-8">cF</text>
</svg>
